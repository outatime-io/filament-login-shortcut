name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.52.0'
            filament: '^4.0'
            testbench: '^10.0'
            pest: '^3.8.2'
            pest_plugin_laravel: '^3.2.0'
          - php: '8.3'
            laravel: '^12.52.0'
            filament: '^4.0'
            testbench: '^10.0'
            pest: '^4.4.1'
            pest_plugin_laravel: '^4.1.0'
          - php: '8.3'
            laravel: '^12.52.0'
            filament: '^5.0'
            testbench: '^10.0'
            pest: '^4.4.1'
            pest_plugin_laravel: '^4.1.0'
          - php: '8.4'
            laravel: '^13.0'
            filament: '^5.0'
            testbench: '^11.0'
            pest: '^4.4.1'
            pest_plugin_laravel: '^4.1.0'
          - php: '8.5'
            laravel: '^13.0'
            filament: '^4.0'
            testbench: '^11.0'
            pest: '^5.1.1'
            pest_plugin_laravel: '^5.0.1'
          - php: '8.5'
            laravel: '^13.0'
            filament: '^5.0'
            testbench: '^11.0'
            pest: '^5.1.1'
            pest_plugin_laravel: '^5.0.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: >-
          composer require --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "filament/filament:${{ matrix.filament }}"
      - run: >-
          composer require --dev --no-update
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin_laravel }}"
      - run: composer update --with-all-dependencies --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer format
      - run: composer analyse
      - run: composer test
