name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            filament: '^4.0'
          - php: '8.3'
            laravel: '^12.0'
            filament: '^4.0'
          - php: '8.3'
            laravel: '^12.0'
            filament: '^5.0'
          - php: '8.4'
            laravel: '^13.0'
            filament: '^5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-interaction
      - run: composer require --no-update "illuminate/support:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer format
      - run: composer analyse
      - run: composer test
